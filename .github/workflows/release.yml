name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (example: v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            ext: tar.gz

          - os: windows-latest
            name: windows
            ext: zip

          - os: macos-latest
            name: macos
            ext: tar.gz

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pyinstaller

      - name: Build Executable (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          pyinstaller \
            --onefile \
            --clean \
            --name splitjoin \
            file-splitter/main.py

      - name: Build Executable (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          pyinstaller --onefile --clean --name splitjoin file-splitter/main.py

      - name: Prepare Linux/macOS Package
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir package
          cp dist/splitjoin package/
          chmod +x package/splitjoin
          tar -czf splitjoin-${{ matrix.name }}-${{ github.event.inputs.version }}.tar.gz -C package .

      - name: Prepare Windows Package
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          mkdir package
          Copy-Item dist\splitjoin.exe package\
          Compress-Archive `
            -Path package\* `
            -DestinationPath "splitjoin-windows-${{ github.event.inputs.version }}.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            *.zip
            *.tar.gz

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect Release Files
        run: |
          mkdir release
          find artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} release/ \;

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: SplitJoin ${{ github.event.inputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
